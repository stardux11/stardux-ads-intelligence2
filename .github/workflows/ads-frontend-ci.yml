name: Ads Intelligence — Frontend Stardux
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/components/layout/**'
      - 'src/components/ads/AdCard.tsx'
      - 'src/components/ads/AdFilters.tsx'
      - 'src/lib/adsFrontendRelease.test.ts'
      - '.github/workflows/ads-frontend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test UI integration
        run: npx tsx --test src/lib/adsFrontendRelease.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
